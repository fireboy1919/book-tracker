<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Z-Index Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    zIndex: {
                        '60': '60',
                        '70': '70',
                        '80': '80',
                        '90': '90',
                        '100': '100',
                        '999': '999',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100">
    <!-- Simulate FullScreenChildView background -->
    <div id="fullscreen-view" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-10 mx-auto p-5 border w-full max-w-4xl shadow-lg rounded-md bg-white min-h-screen">
            <h2 class="text-xl font-bold mb-4">Child's Books - Full Screen View</h2>
            <div class="mb-4">
                <button id="add-book-btn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                    Add Book
                </button>
            </div>
            <div class="space-y-2">
                <div class="border p-3 rounded">Book 1</div>
                <div class="border p-3 rounded">Book 2</div>
                <div class="border p-3 rounded">Book 3</div>
                <div class="border p-3 rounded">Book 4</div>
                <div class="border p-3 rounded">Book 5</div>
            </div>
        </div>
    </div>

    <!-- Simulate AddBookModal -->
    <div id="add-book-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-100 hidden" data-testid="add-book-modal">
        <div class="relative top-10 mx-auto p-4 border w-full max-w-lg shadow-lg rounded-md bg-white">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-medium">Add Book for Test Child</h3>
                <button id="close-modal" class="text-gray-400 hover:text-gray-600">
                    ✕
                </button>
            </div>
            <div class="space-y-4">
                <input type="text" placeholder="Book Title" class="w-full px-3 py-2 border rounded">
                <input type="text" placeholder="Author" class="w-full px-3 py-2 border rounded">
                <button class="w-full px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">
                    Add Book
                </button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('add-book-btn').addEventListener('click', function() {
            document.getElementById('add-book-modal').classList.remove('hidden');
        });

        document.getElementById('close-modal').addEventListener('click', function() {
            document.getElementById('add-book-modal').classList.add('hidden');
        });

        // Log z-index values for debugging
        window.addEventListener('load', function() {
            const fullscreenView = document.getElementById('fullscreen-view');
            const modal = document.getElementById('add-book-modal');
            
            console.log('Fullscreen view z-index:', window.getComputedStyle(fullscreenView).zIndex);
            console.log('Modal z-index:', window.getComputedStyle(modal).zIndex);
        });
    </script>
</body>
</html>
